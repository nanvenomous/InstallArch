# https://taskfile.dev
# requires: xorriso, squashfs-tools, curl, gnupg

version: '3'

vars:
  MIRROR: "https://mirrors.kernel.org/archlinux/iso/latest"
  ISO: "iso/arch.iso"

tasks:
  default:
    desc: "download, verify, and bake the arch iso"
    cmds:
      - task: download
      - task: verify
      - task: bake

  download:
    desc: "download the latest arch linux iso and signature from mirrors.kernel.org"
    cmds:
      - mkdir -p iso
      - curl -L --progress-bar -o "{{.ISO}}" "{{.MIRROR}}/archlinux-x86_64.iso"
      - curl -L -o "{{.ISO}}.sig" "{{.MIRROR}}/archlinux-x86_64.iso.sig"

  verify:
    desc: "verify gpg signature of the downloaded iso"
    cmds:
      - gpg --keyserver-options auto-key-retrieve --verify "{{.ISO}}.sig" "{{.ISO}}"

  bake:
    desc: "inject user_configuration.json and setup_dotfiles.sh into the iso squashfs"
    cmds:
      - sudo bash rsrc/bake.sh

  usb:
    desc: "<device> write arch-custom.iso to a usb drive (e.g. task usb -- /dev/sdb)"
    vars:
      DEVICE: '{{.CLI_ARGS}}'
    preconditions:
      - sh: test -n "{{.DEVICE}}"
        msg: "device required. usage: task usb -- /dev/sdX"
      - sh: test -f iso/arch-custom.iso
        msg: "arch-custom.iso not found — run: task bake"
      - sh: test -b "{{.DEVICE}}"
        msg: "{{.DEVICE}} is not a block device"
    cmds:
      - lsblk "{{.DEVICE}}"
      - echo "writing iso/arch-custom.iso to {{.DEVICE}} in 5 seconds — ctrl-c to abort"
      - sleep 5
      - sudo dd if=iso/arch-custom.iso of={{.DEVICE}} bs=4M status=progress oflag=sync

  config:
    desc: "edit user_configuration.json using the archinstall TUI"
    cmds:
      - sudo archinstall --config user_configuration.json
      # - |
      #   if sudo test -f /var/log/archinstall/user_configuration.json; then
      #     sudo cp /var/log/archinstall/user_configuration.json user_configuration.json
      #     sudo chown "$(id -un):$(id -gn)" user_configuration.json
      #     echo "config saved to user_configuration.json"
      #   else
      #     echo "no saved config found — use 'Save configuration' in the archinstall TUI before quitting"
      #   fi

  clean:
    desc: "remove downloaded iso and work directory"
    cmds:
      - sudo rm -rf iso/ work/
